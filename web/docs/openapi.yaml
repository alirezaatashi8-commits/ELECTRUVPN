openapi: 3.0.3
info:
  title: ELECTRUVPN BETA1 API
  version: BETA1
  description: Provider-neutral management API for ELECTRUVPN BETA1. The deployed router uses /api and /api/v1. The current
    v3.5 Ultra, automation, operations and multi-node control-plane surface is exposed under /api/pro; no separate /api/v3.5
    route prefix is registered.
servers:
- url: /api/v1
  description: API-key scoped v1 API
- url: /api
  description: Authenticated panel/control-plane API; /pro is the current v3.5 surface
paths:
  /health:
    get:
      summary: Health status
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: get_health
  /inbounds:
    get:
      summary: API operation GET /inbounds
      tags:
      - v1
      responses:
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: get_inbounds
      security:
      - bearerAuth: []
    post:
      summary: API operation POST /inbounds
      tags:
      - api
      responses:
        '200':
          description: Successful response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      operationId: post_inbounds
      security:
      - sessionCookie: []
  /clients:
