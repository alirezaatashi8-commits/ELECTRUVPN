  /inbounds/quick-grpc:
    post:
      summary: Create a ready-to-use VLESS gRPC client with quota and expiry
      description: Creates one VLESS+gRPC+REALITY inbound and one client. Port 0 chooses a free random high port. Traffic
        0 means unlimited and days 0 means no expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                remark:
                  type: string
                  maxLength: 128
                clientName:
                  type: string
                  maxLength: 128
                totalGB:
                  type: integer
                  minimum: 0
                days:
                  type: integer
                  minimum: 0
                  maximum: 3650
                port:
                  type: integer
                  minimum: 0
                  maximum: 65535
                  description: 0 selects a free random port
                ipMode:
                  type: string
                  enum:
                  - ipv4
                  - ipv6
                  - dual
                addressType:
                  type: string
                  enum:
                  - ipv4
                  - ipv6
                  - domain
                  - all
      responses:
        '200':
          description: Created
        '400':
          description: Invalid input
        '409':
          description: Requested port or name is unavailable
        '503':
          description: No free port available
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: post_inbounds_quick_grpc
      security:
      - sessionCookie: []
  /inbounds/quick-websocket:
    post:
      summary: Create a ready-to-use VLESS WebSocket client with quota and expiry
      description: Creates one VLESS+WebSocket inbound and one client. Uses a valid managed TLS certificate when available;
        in strict security mode creation is refused without one. Port 0 chooses a free random port.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                remark:
                  type: string
                  maxLength: 128
                clientName:
                  type: string
                  maxLength: 128
                totalGB:
                  type: integer
                  minimum: 0
                days:
                  type: integer
                  minimum: 0
                  maximum: 3650
                port:
                  type: integer
                  minimum: 0
                  maximum: 65535
                ipMode:
                  type: string
                  enum:
                  - ipv4
                  - ipv6
                  - dual
                addressType:
                  type: string
                  enum:
                  - ipv4
                  - ipv6
                  - domain
                  - all
      responses:
        '200':
          description: Created
        '400':
          description: Invalid input
        '409':
          description: Requested port or name is unavailable
        '412':
          description: Strict mode requires a usable TLS certificate
        '503':
          description: No free port available
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: post_inbounds_quick_websocket
      security:
      - sessionCookie: []
