components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        msg:
          type: string
    AutomationRuleInput:
      type: object
      required:
      - name
      - event
      - action
      properties:
        name:
          type: string
          maxLength: 128
        enabled:
          type: boolean
        event:
          type: string
          enum:
          - node_health
          - client_expiry
          - certificate_expiry
          - always
        condition:
          type: string
          maxLength: 8192
          description: JSON condition object
        action:
          type: string
          enum:
          - notify_telegram
          - refresh_alerts
          - cleanup_sessions
          - snapshot_usage
        payload:
          type: string
          maxLength: 16384
          description: JSON action payload
        cooldownSec:
          type: integer
          minimum: 1
          maximum: 604800
    ScheduledTaskInput:
      type: object
      required:
      - name
      - schedule
      - kind
      properties:
        name:
          type: string
          maxLength: 128
        enabled:
          type: boolean
        schedule:
          type: string
          example: '@every 5m'
        kind:
          type: string
          enum:
          - snapshot_usage
          - cleanup_sessions
        payload:
          type: string
          maxLength: 16384
          description: JSON action payload
  parameters:
    ID:
      name: id
      in: path
      required: true
      description: Numeric resource identifier
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequest:
      description: Invalid request or validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required or credentials are invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated principal lacks the required role or scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server-side failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Request rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until the client should retry
          schema:
            type: integer
            format: int32
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API-Key
    sessionCookie:
      type: apiKey
      in: cookie
      name: electru_session
      description: HttpOnly SameSite browser session cookie.
security:
- sessionCookie: []
