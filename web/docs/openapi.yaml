  /subscriptions:
    get:
      summary: List subscription metadata without bearer URLs or tokens
      parameters:
      - name: clientId
        in: query
        schema:
          type: integer
      - name: status
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
        '429':
